server:
  servlet:
    context-path: /ping
  port: 8080
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  http:
    serviceclient:
      pingpong-service:
        base-url: http://pong-service/  #pong-service is the name of the service in OpenShift, and 8080 is the port exposed by the pong-service
        #base-url: http://localhost:8081/
  application:
    name: ping-service
  datasource:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      max-lifetime: 1800000
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
    driverClassName: org.h2.Driver
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:password}
    #username: sa
    #password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true


management:
  tracing:
    sampling:
      probability: 1.0
  server:
    port: 8081
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
        application: ${spring.application.name}
        environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99 # tempo normale,95% è sotto questo tempo,richieste lente
    observations:
      key-values:
        services: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    metrics:
      export:
        enabled: false




logging:
  level:
    application: ${APP_LOG_LEVEL:INFO}
    org:
      springframework: INFO
      hibernate:
        SQL: DEBUG
        org:
          jdbc:
            bind: TRACE
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
        orm:
          jdbc:
            bind: TRACE
