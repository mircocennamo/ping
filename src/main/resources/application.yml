server:
  servlet:
    context-path: /ping
  port: 8080
spring:
  http:
    serviceclient:
      pingpong-service:
        #base-url: http://pong-service:8081/
        base-url: http://localhost:8081/
  application:
    name: spring-ping-service
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true







logging:
  level:
    org:
      springframework: INFO
      hibernate:
        SQL: DEBUG
        org:
          jdbc:
            bind: TRACE
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
        orm:
          jdbc:
            bind: TRACE
